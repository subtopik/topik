version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      vite-plus:
        patterns:
          - "vite-plus"
          - "vite"
          - "@voidzero-dev/vite-plus-core"
          - "vitest"
          # Vitest plugins must match the vitest version that vite-plus pins.
          - "@vitest/*"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      ajv:
        patterns:
          - "ajv"
          - "ajv-formats"
      typescript:
        patterns:
          - "typescript"
          - "@typescript/*"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # jsdom 29+ requires a newer Node 22 minor than Topik's previous 22.12 floor; re-evaluate against the 22.22 floor.
      - dependency-name: "jsdom"
        update-types:
          - "version-update:semver-major"
