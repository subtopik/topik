name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Vite+/Vitest require a newer runtime than the published libraries.
        node-version: ["22.18.0", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: ${{ matrix.node-version }}
          cache: true

      - run: vp install --frozen-lockfile

      - run: vp run -r build

      - name: Verify packed packages
        if: matrix.node-version != '22.18.0'
        run: vp run verify:public-packages

      - name: Verify packed packages and the public Node.js floor
        if: matrix.node-version == '22.18.0'
        run: |
          vp env install 22.12.0
          runtime_node="$(vp env exec --node 22.12.0 node -p process.execPath)"
          vp run verify:public-packages --runtime-node "$runtime_node"

      - run: vp check

      - run: vp test
