name: Fuzz

on:
  schedule:
    - cron: "42 3 * * 1"
  workflow_dispatch:
    inputs:
      seed:
        description: Seed to replay. Leave empty for a random seed.
        required: false
        type: string
      runs:
        description: Cases for each property. Leave empty for the default count.
        required: false
        type: string

permissions:
  contents: read

jobs:
  fuzz:
    name: Property tests with a random seed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true

      - run: vp install --frozen-lockfile

      - name: Build the packages under test and their workspace dependencies
        run: vp run --filter '@topik/core...' --fail-if-no-match build

      # Each package prints its seed. To replay a failure, run this workflow with that seed.
      - name: Explore new inputs
        env:
          TOPIK_FUZZ_SEED: ${{ inputs.seed }}
          TOPIK_FUZZ_RUNS: ${{ inputs.runs }}
        run: vp run fuzz
