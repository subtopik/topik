name: Publish candidate cohort

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag to recover
        required: true
        type: string

permissions: read-all

concurrency:
  group: topik-alpha-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'recovery' || 'initial' }}

jobs:
  ci:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.12.0", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: true

      - run: >-
          node tools/release/cli.mjs verify-tag
          --tag "$RELEASE_TAG"
          --event-ref "$GITHUB_REF"
          --event-sha "$GITHUB_SHA"

      - run: vp install --frozen-lockfile

      - run: vp run -r build

      - run: vp check

      - run: vp test

      - run: vp run release:test

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: "24"
          cache: true
          registry-url: https://registry.npmjs.org

      - run: >-
          node tools/release/cli.mjs verify-tag
          --tag "$RELEASE_TAG"
          --event-ref "$GITHUB_REF"
          --event-sha "$GITHUB_SHA"

      - run: vp install --frozen-lockfile

      - run: vp run -r build

      - run: node tools/release/cli.mjs prepare --artifacts .release-artifacts

      - name: Publish or recover candidate cohort
        run: >-
          node tools/release/cli.mjs publish
          --mode "$RELEASE_MODE"
          --tag "$RELEASE_TAG"
          --event-ref "$GITHUB_REF"
          --event-sha "$GITHUB_SHA"
          --artifacts .release-artifacts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.TOPIK_NPM_RELEASE_TOKEN }}
