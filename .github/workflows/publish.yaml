name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: read-all

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the next step can prove the commit is on main.
          fetch-depth: 0

      # Before anything from the checkout runs: only a commit already on main is published.
      - name: Require a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          # A job that can mint npm credentials never restores a shared cache.
          cache: false

      - run: vp install --frozen-lockfile

      - run: vp run -r build

      - name: Publish packages
        run: node tools/publish-alpha.mjs
