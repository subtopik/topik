name: REUSE Compliance Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

# Supersede outdated pull request runs only. Pushes to main get a unique group
# per run and are never cancelled.
concurrency:
  group: reuse-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
