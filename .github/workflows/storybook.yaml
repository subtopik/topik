name: Storybook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  storybook:
    name: Build and browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24"
          cache: true

      - run: vp install --frozen-lockfile
      - run: vp exec --filter @topik/content-react playwright install --with-deps chromium
      - run: vp run --filter @topik/content-react storybook:build
      - run: vp run --filter @topik/content-react storybook:test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: content-react-storybook
          path: packages/content-react/storybook-static
          if-no-files-found: ignore
          retention-days: 7
