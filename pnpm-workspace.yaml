packages:
  - packages/*
  - tools/*

allowBuilds:
  esbuild: true
  sharp: true

catalog:
  "@changesets/cli": 3.0.1
  "@drizzle-team/brocli": ^0.12.0
  "@markdoc/markdoc": ^0.5.9
  "@types/bun": ^1.4.0
  "@types/node": 22.20.1
  entities: 8.1.0
  github-slugger: ^2.0.0
  json-schema-to-typescript: ^15.0.4
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0

catalogMode: prefer

minimumReleaseAgeExclude:
  - astro@6.4.4

overrides:
  jsdom: 28.1.0
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
    vite-plus: "*"
