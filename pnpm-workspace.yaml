packages:
  - packages/*
  - tools/*

allowBuilds:
  esbuild: true
  sharp: true

catalog:
  "@types/bun": ^1.3.14
  "@types/node": 22.20.1
  json-schema-to-typescript: ^15.0.4
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9

catalogMode: prefer

minimumReleaseAgeExclude:
  - astro@6.4.4

overrides:
  jsdom: 28.1.0
  vite: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
    vite-plus: "*"
